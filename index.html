<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover (added 25 Aug 2026, real bug found live): without it,
         iOS treats the web content's viewport as excluding the top notch/Dynamic
         Island and bottom home-indicator safe areas entirely - in standalone PWA
         mode (installed to Home Screen, no Safari chrome to absorb the
         difference) this leaves a visible gap between any `fixed`/`h-screen`
         element and the true physical screen edge, with whatever is behind it in
         the DOM showing through (reported as: the bottom nav bar not reaching
         the true bottom edge, and separately the Root Admin sidebar/Telegram
         template editor drawer both cutting off partway down with the page's
         own content visible below, unblurred - three symptoms, one shared
         cause). It also makes every `env(safe-area-inset-*)` value evaluate to
         0px - MobileBottomNav.tsx's `pb-[env(safe-area-inset-bottom)]` was
         already written expecting this to work and was silently inert without
         this meta tag providing the safe-area geometry it reads from. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ground Code Resort Management</title>
    <link rel="icon" type="image/png" href="/icons/favicon-32x32.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Mirrors manifest.php's background_color/theme_color (#0B84FF) here
         in the HTML head - without this, the OS's pre-paint transition frame
         (between process cold-start and first pixel) defaults to black
         instead of the app's blue, and iOS has no splash image at all
         without the apple-mobile-web-app-* tags below. -->
    <meta name="theme-color" content="#0B84FF" />
    <!-- mobile-web-app-capable is the standards-track tag (Chrome/Android);
         apple-mobile-web-app-capable is the older Safari-only equivalent -
         Chrome now warns if only the Apple one is present, so both are
         needed rather than one covering the other. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AF POS" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Inter used to load from fonts.googleapis.com here as a plain
         render-blocking <link rel="stylesheet"> - the browser withheld ALL
         painting, including the "instant" #initial-loader below (whose
         entire point is to never be blank), until that third-party
         DNS+TLS+fetch round trip completed. That was the real cause of the
         reported "blank screen for 4-5 seconds" on a cold PWA launch over
         cellular - the loader markup was already here, it just couldn't
         paint yet. Fixed 25 Aug 2026 by self-hosting the font instead
         (@fontsource-variable/inter, imported in main.tsx) - same-origin,
         no external round trip at all, and cacheable by sw.js for real
         offline use. Nothing to reference here anymore. -->
    <style>
      /* Static first-paint loader (18 Aug 2026) - lives here, not in React,
         specifically so it renders instantly from the HTML alone before the
         app bundle has even started downloading/parsing/executing, let
         alone mounted. Any real lag (slow network, cold cache, a low-end
         phone, or the stale-bundle recovery reload above) would otherwise
         show a blank white #root for however long that takes. No JS needed
         to remove it - ReactDOM's render() replaces #root's entire content
         the moment the real app mounts, so this just gets overwritten.
         Deliberately no text ("Loading..." etc) - just a logo + spinner, so
         this reads as an app launching rather than a status message, and
         visually matches LoadingScreen.tsx (the React loader that can follow
         this one) so there's never a jarring style change mid-boot. */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        background: linear-gradient(to bottom right, #f8fafc, #f1f5f9);
      }
      #initial-loader__logo {
        width: 64px;
        height: 64px;
        border-radius: 1rem;
        background: linear-gradient(to bottom right, #3b82f6, #4f46e5);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: initial-loader-pulse 2s ease-in-out infinite;
      }
      #initial-loader__logo svg {
        width: 32px;
        height: 32px;
        color: #fff;
      }
      #initial-loader__spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #dbeafe;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: initial-loader-spin 0.8s linear infinite;
      }
      @keyframes initial-loader-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes initial-loader-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      @media (prefers-color-scheme: dark) {
        #initial-loader { background: linear-gradient(to bottom right, #020617, #0f172a); }
        #initial-loader__spinner { border-color: #1e293b; border-top-color: #60a5fa; }
      }
    </style>
    <script>
      // Custom CSS override, injected via runtime DOM API rather than a
      // static <link> tag on purpose: Vite's HTML plugin treats a literal
      // <link rel="stylesheet" href="..."> as a real CSS entry point to
      // bundle - it silently MERGED this file's content directly into the
      // main built CSS bundle at build time (confirmed: the custom rules
      // ended up baked inside dist/assets/index-*.css), which defeats the
      // entire point of writing it to a separate file - a live edit via
      // the admin UI updates that file on disk correctly, but the site
      // would keep serving the OLD baked-in copy until the next full
      // rebuild+redeploy. A script tag is just a string to Vite's HTML
      // parser, not a recognized asset reference, so it's never touched -
      // this always fetches the file fresh from the server at page load.
      (function () {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/assets/css/custom_css_override.css';
        document.head.appendChild(link);
      })();
    </script>
    <script>
      // Self-healing recovery for "blank white page after reopening a
      // backgrounded PWA" (18 Aug 2026): sw.js is network-first for this
      // HTML, but falls back to whatever copy it last cached if the
      // network fetch fails - which can happen for a moment right as a
      // suspended/killed PWA wakes up and reconnects. If that cached copy
      // predates a deploy since then, it references a hashed JS bundle
      // (deploy-staging.ps1 runs `rsync --delete`) that no longer exists
      // on the server, so the module script below 404s - main.tsx never
      // runs, so there's nothing left to catch or display this failure.
      // Listening for that one specific failure and forcing a real,
      // cache-busted reload resolves it automatically within a second or
      // two instead of leaving a permanently blank screen. Guarded by
      // sessionStorage so a genuinely offline device (no network at all,
      // reload would fail the same way) gets exactly one retry, not a
      // reload loop.
      (function () {
        var alreadyRetried = sessionStorage.getItem('sw_stale_reload_attempted');
        window.addEventListener('error', function (event) {
          var target = event.target;
          if (
            target &&
            target.tagName === 'SCRIPT' &&
            target.src &&
            target.src.indexOf('/assets/') !== -1 &&
            !alreadyRetried
          ) {
            sessionStorage.setItem('sw_stale_reload_attempted', '1');
            window.location.href = window.location.pathname + window.location.search +
              (window.location.search ? '&' : '?') + '_r=' + Date.now() + window.location.hash;
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
    <div id="root">
      <div id="initial-loader">
        <div id="initial-loader__logo">
          <!-- Inline SVG, not <img src="apple-touch-icon.png"> (18 Aug -> fixed 26 Aug 2026): an
               <img> here needs a real network round trip to paint anything, so on a slow/cold
               connection this box sat as a flat glyph-less gradient square for a visible moment -
               exactly the "jarring style change" this loader's own comment above says it exists to
               avoid, since LoadingScreen.tsx's icon (Building2, inline SVG) never has that gap.
               This is the same Building2 glyph (flowbite-react-icons "Building", outline set,
               24x24 viewBox, strokeWidth 2) reproduced by hand so it paints with zero network
               dependency, same as the rest of this static pre-React loader. -->
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 4h12M6 4v16M6 4H5m13 0v16m0-16h1m-1 16H6m12 0h1M6 20H5M9 7h1v1H9zm5 0h1v1h-1zm-5 4h1v1H9zm5 0h1v1h-1zm-3 4h2a1 1 0 0 1 1 1v4h-4v-4a1 1 0 0 1 1-1"/>
          </svg>
        </div>
        <div id="initial-loader__spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
