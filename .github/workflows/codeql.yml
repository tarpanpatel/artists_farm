name: CodeQL Security Analysis

# Scans TypeScript/JavaScript (React frontend + any .js files) for security
# vulnerabilities on every push. Results: Security tab -> Code scanning alerts.
#
# NOTE: PHP scanning requires GitHub Advanced Security (paid) on private repos.
# Only javascript-typescript is scanned here (free for all repos).

on:
  push:
    branches: [main, direct-booking-engine]
  pull_request:
    branches: [main, direct-booking-engine]
  schedule:
    # Weekly full scan every Sunday at 2am IST (8:30pm Saturday UTC)
    - cron: "30 20 * * 6"

jobs:
  analyze:
    name: CodeQL Analyze (TypeScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: +security-extended,security-and-quality

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
