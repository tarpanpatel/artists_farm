<!DOCTYPE html>
<html>
<head>
    <title>Auth Debug</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        .box { background: white; padding: 15px; margin: 10px 0; border-radius: 5px; border: 1px solid #ddd; }
        .key { color: #0066cc; font-weight: bold; }
        .value { color: #006600; }
        pre { background: #f9f9f9; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Authentication State Debug</h1>

    <div class="box">
        <p><span class="key">Current URL:</span> <span class="value" id="url"></span></p>
        <p><span class="key">Property Slug (extracted):</span> <span class="value" id="slug"></span></p>
    </div>

    <div class="box">
        <h3>localStorage (Auth)</h3>
        <pre id="localStorage"></pre>
    </div>

    <div class="box">
        <h3>All localStorage keys:</h3>
        <pre id="allKeys"></pre>
    </div>

    <script>
        // Show URL
        document.getElementById('url').textContent = window.location.href;

        // Extract property slug like the app does
        function getPropertySlug() {
            const segments = window.location.pathname
                .replace(/#.*$/, '')
                .split('/')
                .filter(Boolean)
                .filter((seg) => !seg.includes('.'));

            for (let i = segments.length - 1; i >= 0; i--) {
                const seg = segments[i].toLowerCase();
                if (!/^(artists_farm|php|dist|assets|icons|api|backups|node_modules)$/.test(seg)) {
                    return seg;
                }
            }
            return 'default';
        }

        const slug = getPropertySlug();
        document.getElementById('slug').textContent = slug;

        // Show localStorage
        const authKey = `artists_farm_authenticated_${slug}`;
        const userKey = `artists_farm_user_${slug}`;

        const authData = {
            [authKey]: localStorage.getItem(authKey),
            [userKey]: localStorage.getItem(userKey)
        };

        document.getElementById('localStorage').textContent = JSON.stringify(authData, null, 2);

        // Show all keys
        const allKeys = [];
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            allKeys.push(`${key}: ${localStorage.getItem(key)?.substring(0, 50)}...`);
        }
        document.getElementById('allKeys').textContent = allKeys.join('\n');
    </script>
</body>
</html>
